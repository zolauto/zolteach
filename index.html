<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZolTeach <br>

Műszaki Képzési Akadémia</title>
    
    <!-- Beemeljük a lágyabb, lekerekített formájú prémium betűtípusokat -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Exo+2:ital,wght@0,600;0,700;1,600&family=Ubuntu:wght@400;500&display=swap" rel="stylesheet">
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        /* A fő szöveg betűtípusa az Ubuntu lesz, ami nagyon lágy és könnyen olvasható */
        body { 
            font-family: 'Ubuntu', sans-serif; 
            background-color: #0b0d10; 
            color: #f3f4f6; 
        }
        
        .hero {
            background: linear-gradient(rgba(11, 13, 16, 0.82), rgba(11, 13, 16, 0.82)), 
                        url('zolteach-hatterkep-jpeg.jpeg') no-repeat center center/cover;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 40px 20px;
        }

        /* A főcím az Exo 2 típust kapja, ami modern, de lekerekített sarkú és barátságos */
        h1 { 
            font-family: 'Exo 2', sans-serif; 
            font-size: 3.5rem; 
            font-weight: 700;
            margin-bottom: 24px; 
            color: #ffffff; 
            letter-spacing: 1px;
            line-height: 1.2;
        }
        
        /* Itt állítjuk be a kiemelt rész színét (A régi font color helyett) */
        h1 span { 
            color: #ffb703; 
        }

        p { 
            font-size: 1.4rem; 
            max-width: 900px; 
            margin-bottom: 48px; 
            color: #d1d5db; 
            line-height: 1.8; 
            font-weight: 400;
        }
        
        .btn {
            font-family: 'Exo 2', sans-serif;
            background-color: #ffb703;
            color: #0b0d10;
            padding: 18px 40px;
            font-size: 1.3rem;
            font-weight: 600;
            text-decoration: none;
            border-radius: 8px; /* Lágyabb, kerekített sarkok a gombnak is */
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(255, 183, 3, 0.2);
        }
        .btn:hover { 
            background-color: #ffffff; 
            color: #0b0d10;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 255, 255, 0.3);
        }
    </style>
</head>
<body>

    <section class="hero">
        <!-- A <br> jelekkel pontosan ott törjük meg a sort, ahol logikus -->
        <h1>ZolTeach <br><span>Műszaki Képzési Akadémia</span></h1>
        
        <p>
            Gyakorlatorientált ipari és karbantartói tréningek vállalatok számára. <br>
            Fejlessze csapata diagnosztikai hibakeresési logikáját valós rendszereken, <br>
            ezzel minimálisra csökkentve a gyártási állásidőt.
        </p>
        
        <a href="#" class="btn">Vállalati ajánlatkérés</a>
    </section>

</body>
</html>
