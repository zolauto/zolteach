<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZolTeach Műszaki Képzési Akadémia</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #111; color: #fff; }
        
        .hero {
            background: linear-gradient(rgba(0, 0, 0, 0.75), rgba(0, 0, 0, 0.75)), 
                        url('zolteach-hatterkep-jpeg.jpeg') no-repeat center center/cover;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }

        h1 { font-size: 3rem; margin-bottom: 20px; color: #ffffff; text-transform: uppercase; letter-spacing: 2px; }
        p { font-size: 1.5rem; max-width: 800px; margin-bottom: 40px; color: #ccc; line-height: 1.6; }
        
        .btn {
            background-color: #0076a3;
            color: white;
            padding: 15px 30px;
            font-size: 1.2rem;
            text-decoration: none;
            font-weight: bold;
            border-radius: 5px;
            transition: background 0.3s;
        }
        .btn:hover { background-color: #005c80; }
    </style>
</head>
<body>

    <section class="hero">
        <h1>ZolTeach Műszaki Képzési Akadémia</h1>
        <p>Gyakorlatorientált műszaki képzések vállalatok számára. Fejlessze karbantartó csapata diagnosztikai logikáját valós ipari rendszereken!</p>
        <a href="#" class="btn">Vállalati Szakmai Érdeklődés</a>
    </section>

</body>
</html>
