<!-- NAVIGÁCIÓS MENÜ CSS (Beillesztendő a <head> részbe vagy a közös CSS fájlba) -->
<style>
  .top-nav {
    position: fixed;
    top: 0; 
    left: 0; 
    right: 0;
    background: rgba(11, 13, 16, 0.95);
    padding: 10px 20px;
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    z-index: 9999;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid rgba(255, 255, 255, 0.1);
  }

  .nav-logo {
    display: flex;
    align-items: center;
  }

  .nav-logo img {
    height: 45px;
    width: auto;
  }

  .nav-links {
    display: flex;
    gap: 25px;
    align-items: center;
  }

  .nav-links a {
    color: #ccff00;
    text-decoration: none;
    font-weight: 500;
    font-size: 16px;
    transition: color 0.3s ease;
  }

  .nav-links a:hover { 
    color: #ffffff; 
  }

  /* Aktív menüpont kiemelése */
  .menu-active {
    color: #ffb703 !important;
    font-size: 17px !important;
    font-weight: 700 !important;
    cursor: default;
    text-decoration: none;
  }

  /* Mobil és tablet nézet (768px alatti kijelzők) */
  @media (max-width: 768px) {
    .top-nav { 
      flex-direction: column; 
      gap: 10px; 
      padding: 12px 15px;
    }
    .nav-links { 
      gap: 15px; 
      flex-wrap: wrap; 
      justify-content: center; 
    }
  }
</style>

<!-- NAVIGÁCIÓS MENÜ HTML (Beillesztendő a <body> legelejére) -->

</nav>
