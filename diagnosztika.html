<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Strukturált ipari diagnosztikai és hibakeresési tréning karbantartó csapatoknak. ZolTeach Műszaki Képzési Akadémia.">
    <title>Diagnosztika Képzés - ZolTeach</title>
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Exo+2:wght@600;700&family=Ubuntu:wght@400;500&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background-color: #0b0d10;
    color: #e5e7eb;
  }

  /* háttérréteg: kép + sötét átlátszó réteg */
  .teszt-hatter {
    position: fixed;
    inset: 0; /* top:0; right:0; bottom:0; left:0; */
    z-index: 0;
    background-image: linear-gradient(rgba(11,13,16,0.30), rgba(11,13,16,0.30)),
                      url('images/diagnosztika-githubhoz.jpg');
    background-repeat: no-repeat;
    background-position: center center;
    background-attachment: fixed;
    background-size: cover;
    pointer-events: none; /* a háttér ne fogja meg a kattintásokat */
  }

  /* tartalom, ami a kép fölött van */
  .content-wrapper {
    position: relative;
    z-index: 2;
    max-width: 900px;
    margin: 0 auto;
    padding: 60px 20px;
    color: #e5e7eb;
  }

  /* ha van .container osztályod, biztosítsd, hogy látható legyen */
  .container, .content-wrapper {
    color: #e5e7eb !important;
  }
</style>

</html>
