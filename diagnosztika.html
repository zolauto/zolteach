<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Diagnosztika — Háttér teszt</title>
  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      background: #0b0d10;
    }

    /* teljes képernyős háttérkép */
    .bg {
      position: fixed;
      inset: 0; /* top:0; right:0; bottom:0; left:0; */
      background-image: url('images/diagnosztika-githubhoz.jpg');
      background-repeat: no-repeat;
      background-position: center center;
      background-size: cover;
      background-attachment: fixed;
      z-index: 0;
    }

    /* ha később szöveget akarsz, ez a réteg lesz fölötte */
    .content {
      position: relative;
      z-index: 2;
      color: #e5e7eb;
      max-width: 900px;
      margin: 0 auto;
      padding: 40px 20px;
    }
  </style>
</head>
<body>
  <div class="bg" aria-hidden="true"></div>

  <!-- jelenleg üres tartalom; később ide jön a szöveg -->
  <div class="content" aria-hidden="true"></div>
</body>
</html>
